# /etc/nginx/sites-available/vink — Vink at https://vink.page, behind the Cloudflare proxy
# (visitor IPs: conf.d/cloudflare-realip.conf). certbot --nginx adds the TLS server blocks.
server {
    server_name www.vink.page;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://vink.page$request_uri;
    }



}

server {
    server_name vink.page;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }



}

server {
    if ($host = vink.page) {
        return 301 https://$host$request_uri;


    server_name vink.page;

    listen 80;
    listen [::]:80;


}
server {
    if ($host = www.vink.page) {
        return 301 https://$host$request_uri;


    server_name www.vink.page;
    listen 80;
    listen [::]:80;


}

# certbot --nginx -d vink.page -d www.vink.page adds TLS.
# /etc/nginx/conf.d/cloudflare-realip.conf restores visitor IPs behind the proxy
# (set_real_ip_from <Cloudflare ranges>; real_ip_header CF-Connecting-IP;).
