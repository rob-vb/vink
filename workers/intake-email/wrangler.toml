# Deploy with `npx wrangler deploy` from this folder (see README.md).
name = "vink-intake-email"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Email only: no public workers.dev URL.
workers_dev = false

[vars]
# The Convex deployment's HTTP actions URL (…convex.site), without a trailing slash.
CONVEX_SITE_URL = "https://spotted-parakeet-30.eu-west-1.convex.site"

[[r2_buckets]]
binding = "PDFS"
# The same EU bucket the app uses for PDFs (prod).
bucket_name = "docuhelper"
jurisdiction = "eu"

# Secret, set with `npx wrangler secret put INTAKE_SECRET < .intake-secret`
# (same value as the Convex deployment's INTAKE_SECRET; the file is gitignored).
